## =====================================================================================
## Custom real issuers via the PostgresDataProviderPlugin (no mock CSV plugin).
##
## Activated by `active_profile_env=default,postgres-custom` on the certify service.
## The plugin reuses Certify's own spring.datasource connection (inji_certify DB), so
## the identity tables created in certify_init.sql are queried directly — no separate
## datasource config is required.
## =====================================================================================

## ---- Plugin selection -------------------------------------------------------------
mosip.certify.plugin-mode=DataProvider
mosip.certify.integration.scan-base-package=io.mosip.certify
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.data-provider-plugin=PostgresDataProviderPlugin
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020

## ---- Holder id prefix (matches the ${_holderId} woven into the VC subject) ---------
mosip.certify.data-provider-plugin.id-field-prefix-uri=https://mosip.io/credential/

## ---- Issuer DID (did:web hosted on GitHub Pages) -----------------------------------
## Replaced by generate-config.sh with your real did:web, e.g.
##   did:web:<gh-user>.github.io:<repo>:inji-issuer
mosip.certify.data-provider-plugin.did-url=did:web:viitoradmin.github.io:inji-digital-health-id:inji-issuer

## ---- Issuer display (required since Certify 0.12.x) -------------------------------
mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'Inji Custom Issuer',\
    'locale': 'en'\
  }\
}

## ---- Scope -> SQL query mapping ----------------------------------------------------
## `:id` is bound to the access-token `sub` (the citizen UIN). Columns are aliased to
## the camelCase keys that the Velocity VC templates reference.
mosip.certify.data-provider-plugin.postgres.scope-query-mapping={\
  'student_vc_ldp':   'select fullname as "fullName", studentid as "studentId", program as "program", enrollmentyear as "enrollmentYear", email as "email" from certify.university_student_data where uin=:id',\
  'insurance_vc_ldp': 'select fullname as "fullName", policynumber as "policyNumber", plan as "plan", validuntil as "coverageValidUntil" from certify.health_insurance_data where uin=:id'\
}

## ---- Searchable (ledger) indexed mappings ------------------------------------------
mosip.certify.indexed-mappings.fullName=$.fullName
