services:
  database:
    image: 'postgres:15'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./certify_init.sql:/docker-entrypoint-initdb.d/certify_init.sql
      - ./mimoto_init.sql:/docker-entrypoint-initdb.d/mimoto_init.sql
      - ./verify_init.sql:/docker-entrypoint-initdb.d/verify_init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - network
    ports:
      - "${INJI_STACK_POSTGRES_PORT:-5434}:5432"

  # Runs on every `docker compose up` (idempotent). Fixes missing records table
  # when Postgres data volume already exists (initdb.d scripts do not re-run).
  records-schema-init:
    image: postgres:15
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./scripts/ensure-records.sh:/ensure-records.sh:ro
      - ./scripts/records_table.sql:/schema/records_table.sql:ro
      - ./scripts/seed_records_sample.sql:/schema/seed_records_sample.sql:ro
      - ./scripts/healthid_credential_config.sql:/schema/healthid_credential_config.sql:ro
    entrypoint: ['/bin/bash', '/ensure-records.sh']
    restart: 'no'
    networks:
      - network

  adminer:
    image: adminer:4.8.1
    ports:
      - "${INJI_STACK_ADMINER_PORT:-9050}:8080"
    networks:
      - network
    depends_on:
      - database

  certify:
    build:
      context: ../..
      dockerfile: docker-compose/docker-compose-injistack/Dockerfile.certify-local
    image: inji-certify-injistack:local
    user: root
    ports:
      - 8090:8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - container_user=mosip
      # Spring profiles. This must match the suffix of `certify-<profile>.properties`.
      - active_profile_env=default,postgres-person
      # Only load required plugins; exclude mock-certify-plugin.jar (it requires mock-only properties).
      - loader_path_env=/home/inji/additional_jars/postgres-dataprovider-plugin.jar,/home/inji/additional_jars/mosip-identity-certify-plugin.jar,/home/inji/additional_jars/sunbird-rc-certify-integration-impl.jar
      - SPRING_CONFIG_NAME=certify
      - SPRING_CONFIG_LOCATION=/home/mosip/config/
      - enable_certify_artifactory=false
      - download_hsm_client=false
      - mosip_certify_domain_url=http://certify-nginx:80
    volumes:
      - ./config/certify-default.properties:/home/mosip/config/certify-default.properties
      - ./config/certify-postgres-person.properties:/home/mosip/config/certify-postgres-person.properties
      - ./config/certify-mock-mdl.properties:/home/mosip/config/certify-mock-mdl.properties
      - ./data/CERTIFY_PKCS12:/home/mosip/CERTIFY_PKCS12
      # Optional: override plugin JARs (see README).
      #      - ./loader_path/certify/:/home/mosip/additional_jars/
      - ./config/vp_request_config.json:/home/mosip/config/vp_request_config.json
    networks:
      - network
    depends_on:
      - database

  certify-nginx:
    image: nginx:stable
    ports:
      - 8091:80
      - 8443:443
    volumes:
      - ./certify-nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs/certify-nginx.crt:/etc/nginx/certs/certify-nginx.crt:ro
      - ./certs/certify-nginx.key:/etc/nginx/certs/certify-nginx.key:ro
      - ./config/mimoto-issuers-config.json:/config/server/mimoto-issuers-config.json
      - ./config/mimoto-trusted-verifiers.json:/config/server/mimoto-trusted-verifiers.json
      - ./config/credential-template.html:/config/server/credential-template.html
      - ./config/vp_request_config.json:/config/server/vp_request_config.json
    networks:
      - network
    depends_on:
      - certify


  mimoto-service:
    container_name: 'mimoto-service'
    image: injistack/mimoto:0.21.0
    user: root
    ports:
      - '8099:8099'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - container_user=mosip
      - active_profile_env=default
      - SPRING_CONFIG_NAME=mimoto
      - SPRING_CONFIG_LOCATION=/home/mosip/
      - SPRING_CLOUD_BOOTSTRAP_LOCATION=/home/mosip/mimoto-bootstrap.properties
      - oidc_p12_password=xy4gh6swa2i
      - WALLET_BINDING_PARTNER_API_KEY=dummywalletbindingpartnerapikey
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/inji_mimoto
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - GOOGLE_OAUTH_CLIENT_ID=clientId
      - GOOGLE_OAUTH_CLIENT_SECRET=clientSecret
    networks:
      - network
    volumes:
      - ./config/mimoto-default.properties:/home/mosip/mimoto-default.properties
      - ./config/mimoto-bootstrap.properties:/home/mosip/mimoto-bootstrap.properties
      - ./config/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json
      - ./config/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json
      - ./certs/oidckeystore.p12:/home/mosip/certs/oidckeystore.p12
    depends_on:
      - database

  inji-web:
    container_name: 'inji-web'
    image: injistack/inji-web:0.16.0
    ports:
      - '3004:3004'
    extra_hosts:
      - "host.docker.internal:host-gateway"



    environment:
      - DEFAULT_LANG=en
      - MIMOTO_URL=http://localhost:8099/v1/mimoto
    volumes:
      - ./config/mimoto-default.properties:/home/mosip/mimoto-default.properties
      - ./config/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json
      - ./config/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json
      - ./config/credential-template.html:/home/mosip/credential-template.html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - mimoto-service
    networks:
      - network

## Enable this to test Presentation during Issuance locally
  verify-service:
    container_name: verify-service
    image: injistack/inji-verify-service:0.17.0
    user: root
    ports:
      - "8095:8080"
    environment:
      - active_profile_env=default
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_NAME=inji_verify
      - DATABASE_SCHEMA=verify
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - INJI_VP_REQUEST_LONG_POLLING_TIMEOUT=55000
      - INJI_VP_SUBMISSION_BASE_URL=http://verify-service:8080/v1/verify
      - INJI_DID_VERIFY_URI=did:web:verify-service:v1:verify
      - 'INJI_DID_VERIFY_PUBLIC_KEY_URI=did:web:verify-service:v1:verify#key-0'
      - INJI_KEYSTORE_FILE_PASS=mosip
      - INJI_VERIFY_REDIRECT_URI=http://verify-service:8080
      # Trust the self-signed cert for certify-nginx HTTPS DID resolution
      - JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/etc/ssl/custom/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit
    volumes:
      - ./certs/truststore.jks:/etc/ssl/custom/truststore.jks:ro
    depends_on:
      - database
    networks:
      - network

networks:
  network:
    name: mosip_network
    # Use a compose-managed bridge network so service DNS (e.g. `database`) works reliably.
    # If you have an existing external `mosip_network`, remove it before `docker compose up`.

volumes:
  cache:
    driver: local
  postgres-data:
  