# Local Postgres-backed person data (no CSV / mock identity file).
# Requires injistack/inji-certify-with-plugins image (includes postgres-dataprovider-plugin).

## ------------------------------------------- Plugin enable properties -----------------------------------------------
mosip.certify.integration.scan-base-package=io.mosip.certify
mosip.certify.integration.audit-plugin=LoggerAuditService
# Do not enable mock VCI issuance plugins in this profile (they require extra mock properties).

## ------------------------------------------- Data provider ----------------------------------------------------------
mosip.certify.plugin-mode=DataProvider
mosip.certify.integration.data-provider-plugin=PostgresDataProviderPlugin
mosip.certify.data-provider-plugin.id-field-prefix-uri=https://mosip.io/credential/
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020

# Map OpenID credential scope -> SQL; :id is taken from JWT sub (see mosip.certify.pre-auth.subject-claim-key in certify-default.properties).
mosip.certify.data-provider-plugin.postgres.scope-query-mapping={\
  'person_vc_ldp': 'select person_id as "personId", full_name as "fullName", date_of_birth as "dateOfBirth", gender as "gender", email as "email" from certify.person_data where person_id = :id',\
  'health_vc_ldp': 'select id as "id", first_name as "firstName", last_name as "lastName", to_char(dob, ''YYYY-MM-DD'') as "dateOfBirth", gender as "gender", email as "email", phone_number as "phoneNumber" from certify.records where id = :id'\
}

# Use Docker-internal service name so verify-service can resolve the DID within the mosip_network.
# did:web:certify-nginx resolves to http://certify-nginx/.well-known/did.json (port 80 inside Docker).
mosip.certify.data-provider-plugin.did-url=did:web:certify-nginx

mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'Local Person Issuer',\
    'locale': 'en'\
  }\
}
